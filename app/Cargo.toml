[package]
name = "nodestro-desktop"
version = "0.2.0-preview.1"
edition = "2021"
publish = false
license = "MIT"
description = "Nodestro as a desktop application: a window for the bundled studio backend"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
getrandom = "0.4"
# The MCP token vault key (ADR-0007 D-3) lives in the operating system's keychain: Secret Service on Linux (pure Rust
# D-Bus, no libdbus), Keychain on macOS, Credential Manager on Windows.
keyring = { version = "3.6", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust", "apple-native", "windows-native"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
