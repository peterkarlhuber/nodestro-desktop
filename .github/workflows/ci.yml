name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # CI-FAST AP1: a new push to a pull request cancels the older run of that pull request. Every other run (master
  # push, schedule, dispatch, and the nightly's workflow_call, where github.workflow is "Nightly") gets its own group
  # from github.run_id, so it is never cancelled and never waits behind another run.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # CI-FAST AP1: p99 2.8 min (successful runs 2026-11-01..07)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck scripts/*.sh spike/backend/*.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: python3 -m py_compile scripts/release_manifest.py scripts/scan_secrets.py scripts/cargo_licenses.py scripts/fetch_ollama.py scripts/pin_distance.py scripts/check_server_copies.py
      - run: python3 -I scripts/test_scan_secrets.py
      - run: python3 -I scripts/test_release_manifest.py
      - run: python3 -I scripts/test_fetch_ollama.py
      - run: python3 -I scripts/test_pin_distance.py
      - run: python3 -I scripts/test_check_server_copies.py
      - name: Release scripts are the copies of nodestro-server's
        # scripts/check_server_copies.py: a change made only here fails; an older server version is a warning.
        run: python3 -I scripts/check_server_copies.py
      - name: The studio pin is not behind studio master (a warning, never blocking)
        continue-on-error: true
        run: python3 -I scripts/pin_distance.py studio.json
      - name: The shell's version is a version
        run: grep -Eq '^version = "[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?"$' app/Cargo.toml
      - run: node --check app/ui/start.js && node --check spike/electron/main.js && node --check scripts/npm_licenses.mjs
      - name: studio.json names a full commit
        run: python3 -c 'import json,re; assert re.fullmatch(r"[0-9a-f]{40}", json.load(open("studio.json"))["nodestro-studio"])'

  audit:
    # Known vulnerabilities in the shell's Rust dependencies (app/Cargo.lock), from the RustSec advisory database.
    # Advisories of the kinds "unmaintained" and "unsound" are reported as warnings and do not fail the job.
    runs-on: ubuntu-latest
    timeout-minutes: 15 # CI-FAST AP1: p99 3.8 min (successful runs 2026-11-01..07)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install cargo-audit --locked --version 0.22.2
      - working-directory: app
        run: cargo audit

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 70 # CI-FAST AP1: p99 44.8 min (successful runs 2026-11-01..07)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System libraries of the Tauri shell (WebKitGTK 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev libxdo-dev gnome-keyring dbus-x11
      - working-directory: app
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --release
      - name: The shell's Windows code compiles and passes clippy (no Windows build yet, DSK-004)
        # Cross-checking needs only the target's standard library; linking and the backend need Windows.
        working-directory: app
        run: |
          # The build script compiles the Windows resources with llvm-rc (tauri-winres); it is not on PATH by default.
          if ! command -v llvm-rc >/dev/null; then
            rc=$(ls /usr/lib/llvm-*/bin/llvm-rc 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -z "$rc" ]; then
              sudo apt-get install -y llvm
              rc=$(ls /usr/lib/llvm-*/bin/llvm-rc | sort -V | tail -n 1)
            fi
            export PATH="$(dirname "$rc"):$PATH"
          fi
          command -v llvm-rc
          rustup target add x86_64-pc-windows-msvc
          cargo clippy --locked --target x86_64-pc-windows-msvc -- -D warnings
      - name: The MCP token vault key in a real keychain (Secret Service, unlocked gnome-keyring)
        working-directory: app
        run: |
          dbus-run-session -- sh -ec '
            eval "$(printf "ci\n" | gnome-keyring-daemon --unlock --components=secrets)"
            cargo test --locked -- --ignored
          '
      - run: python3 -m pip install --user uv==0.13.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the backend from the pinned studio commit
        run: |
          scripts/build_backend.sh "$RUNNER_TEMP/backend"
      - name: Package
        run: scripts/package_linux.sh app/target/release/nodestro-desktop "$RUNNER_TEMP/backend" nodestro-linux-x86_64.tar.gz
      - name: Smoke test on a clean Ubuntu 24.04 container
        run: scripts/smoke_test.sh nodestro-linux-x86_64.tar.gz
      # The release manifest and license inventory are built on every change, so a release never meets them first.
      - name: Release manifest (dry run)
        run: |
          python3 scripts/release_manifest.py --product nodestro-desktop --version "ci-${GITHUB_SHA::12}" \
            --out "$RUNNER_TEMP/release" --studio-meta "$RUNNER_TEMP/backend/meta" \
            --python "$RUNNER_TEMP/backend/python/bin/python3" --cargo-manifest app/Cargo.toml \
            --bundled ollama="$RUNNER_TEMP/backend/ollama/OLLAMA-RELEASE" \
            --platform linux-x86_64 nodestro-linux-x86_64.tar.gz
          python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print("unknown licenses:", m["licenses"]["unknown"])' "$RUNNER_TEMP/release/release-manifest.json"
      - name: Secret scan of the archive
        run: python3 -I scripts/scan_secrets.py nodestro-linux-x86_64.tar.gz "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nodestro-linux-x86_64
          path: nodestro-linux-x86_64.tar.gz
          retention-days: 7

  # A local, unsigned test build on real macOS (scripts/local_test_build.sh, docs/testing.md): the shell and the
  # backend are built on the runner, the window starts the bundled backend, and the secret handover, Docker detection,
  # the sandbox status, a person's tool, the refusal of untrusted code and the shutdown are checked. Nothing is signed,
  # uploaded or published. macos-latest (Apple Silicon) has no Docker (no nested virtualization), so it tests the case
  # without Docker; macos-15-intel also runs Colima (Docker Engine in a VM), where untrusted code must run in a proven
  # container. Docker Desktop itself cannot be installed on hosted runners and stays a manual check.
  macos-test-build:
    name: macOS test build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            docker: false
          - os: macos-15-intel
            docker: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m pip install --user --break-system-packages uv==0.13.1 && echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Colima (macOS Intel)
        id: colima
        if: matrix.docker
        run: |
          brew install colima docker
          echo "version=$(colima version | awk 'NR==1 {print $3}')" >> "$GITHUB_OUTPUT"
      # The VM image comes from a GitHub release of colima-core; when that download fails (HTTP 504 on 2026-11-08 for
      # over an hour), the cached image keeps the job independent of it.
      - name: Colima VM image cache
        if: matrix.docker
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/colima
            ~/Library/Caches/lima
          key: colima-image-${{ runner.os }}-${{ runner.arch }}-${{ steps.colima.outputs.version }}
      - name: Start Colima (macOS Intel)
        if: matrix.docker
        run: |
          # Three attempts, vz first and QEMU as fallback each time, with a pause for transient download errors.
          for attempt in 1 2 3; do
            if colima start --cpu 3 --memory 6 --disk 40; then break; fi
            colima delete --force || true
            brew list qemu >/dev/null 2>&1 || brew install qemu
            if colima start --vm-type qemu --cpu 3 --memory 6 --disk 40; then break; fi
            colima delete --force || true
            if [ "$attempt" = 3 ]; then echo "::error::Colima did not start in 3 attempts"; exit 1; fi
            echo "::warning::Colima start attempt $attempt failed; retrying in $((attempt * 90)) s"
            sleep $((attempt * 90))
          done
          docker info
      - name: Build and stage the test app
        run: |
          scripts/local_test_build.sh --build-only "$RUNNER_TEMP/local-test"
      - name: Test with Docker (Colima)
        if: matrix.docker
        run: scripts/local_test_build.sh --test-only "$RUNNER_TEMP/local-test"
      - name: Test without Docker
        env:
          DOCKER_HOST: unix:///nonexistent
        run: scripts/local_test_build.sh --test-only "$RUNNER_TEMP/local-test"

  # The archive from the app job on real Ubuntu 24.04 and Debian 13 machines: built-in sandbox and window.
  systems:
    needs: app
    uses: ./.github/workflows/systems.yml
    with:
      artifact: nodestro-linux-x86_64
      archive: nodestro-linux-x86_64.tar.gz
