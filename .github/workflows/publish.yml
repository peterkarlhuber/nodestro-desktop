name: Publish release

# The only workflow that publishes. A person starts it by hand after reviewing a passed "Release candidate" run;
# the confirmation must read "publish <version>". It takes that run's files unchanged, checks their SHA-256 sums, the
# version and the commit, and creates a **draft pre-release** with them. The tag is created only when a person
# publishes that draft. The `release` environment can add required reviewers (repository settings).
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: "Run ID of a passed 'Release candidate' run on master"
        required: true
      version:
        description: "Version of that run, for example v0.2.0-preview.1"
        required: true
      confirm:
        description: "Type: publish <version>"
        required: true

permissions:
  contents: read

concurrency:
  group: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read # the candidate run and its artifact
      contents: write # the draft release
    env:
      RUN: ${{ inputs.candidate_run }}
      VERSION: ${{ inputs.version }}
      CONFIRM: ${{ inputs.confirm }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the confirmation and the candidate run
        id: run
        run: |
          [ "$CONFIRM" = "publish $VERSION" ] || { echo "::error::the confirmation must read: publish $VERSION"; exit 1; }
          [[ "$RUN" =~ ^[0-9]+$ ]] || { echo "::error::not a run ID: $RUN"; exit 1; }
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::not a version: $VERSION"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" > run.json
          python3 - <<'PY'
          import json, sys
          run = json.load(open("run.json"))
          checks = {
              "workflow": run["path"].split("@")[0] == ".github/workflows/release.yml",
              "passed": run["conclusion"] == "success",
              "branch": run["head_branch"] == "master",
              "repository": run["head_repository"]["full_name"] == run["repository"]["full_name"],
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              sys.exit(f"::error::run {run['id']} is not a passed release candidate on master: {failed}")
          PY
          # Candidates built before the built-in sandbox was validated were withdrawn (2026-10-31 NO-GO); a candidate
          # must also have passed the tests of the packaged app on the real systems (systems.yml).
          case "$RUN" in 41212112554|41212693919) echo "::error::run $RUN is a withdrawn candidate"; exit 1 ;; esac
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/jobs?per_page=100" > jobs.json
          python3 - <<'PY'
          import json, sys
          jobs = {j["name"]: j["conclusion"] for j in json.load(open("jobs.json"))["jobs"]}
          need = [f"systems / system ({s})" for s in ("ubuntu-24.04", "debian-13")]
          missing = [n for n in need if jobs.get(n) != "success"]
          if missing:
              sys.exit(f"::error::the candidate did not pass the tests on the real systems: {missing}")
          PY
          sha=$(python3 -c 'import json; print(json.load(open("run.json"))["head_sha"])')
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...master" --jq .status)
          case "$status" in identical|ahead) ;; *) echo "::error::$sha is not on master ($status)"; exit 1 ;; esac
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::a release $VERSION exists already"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: release
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
      - name: Check the files
        env:
          SHA: ${{ steps.run.outputs.sha }}
        run: |
          (cd release && sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          import json, os, sys
          m = json.load(open("release/release-manifest.json"))
          if m["version"] != os.environ["VERSION"] or m["commit"] != os.environ["SHA"]:
              sys.exit("::error::the manifest names another version or commit")
          if m["signing"]["status"] != "unsigned" or m["licenses"]["unknown"]:
              sys.exit("::error::unexpected signing state or packages without a license")
          PY
      - name: Create the draft pre-release
        env:
          SHA: ${{ steps.run.outputs.sha }}
        run: |
          gh release create "$VERSION" release/* --repo "$GITHUB_REPOSITORY" --draft --prerelease --target "$SHA" \
            --title "Nodestro Desktop $VERSION (Linux x86_64, unsigned preview)" \
            --notes "Unsigned preview build, not for production data. Linux x86_64 only: glibc 2.39 or newer and WebKitGTK 4.1 (see README.md, System requirements). AI-generated tools run in the built-in Linux sandbox, validated on Ubuntu 24.04 and Debian 13 only; elsewhere they are blocked unless Docker is available. Verify the archive with sha256sum -c SHA256SUMS. Built, smoke-tested and tested on real Ubuntu 24.04 and Debian 13 machines in candidate run $RUN. Component pins, license inventory and signing state are in release-manifest.json. macOS and Windows are not built or tested."
