name: Release candidate

# Builds and checks a release candidate. It never publishes anything: no tag, no GitHub release, and its token can
# only read. A person starts it with the version, which must equal the shell's version in app/Cargo.toml. It builds
# the Linux x86_64 archive exactly as CI does, runs the clean-machine smoke test, scans the archive for secrets and
# writes the manifest and checksums. Everything goes into the run's `release-candidate` artifact, which systems.yml
# then tests on real Ubuntu 24.04 and Debian 13 machines (built-in sandbox, window, GNOME Shell). Publishing is a
# separate, manual step: publish.yml with this run's ID.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, for example v0.2.0-preview.1"
        required: true

permissions:
  contents: read

jobs:
  nightly-gate:
    # CI-FAST release lock: no candidate and no publication unless the latest completed nightly (nightly.yml on master)
    # of this repository and of nodestro-studio (public; read with this run's token) passed and is less than 36 hours old.
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: The latest nightlies of this repository and of nodestro-studio passed within 36 hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=0
          for repo in "$GITHUB_REPOSITORY" peterkarlhuber/nodestro-studio; do
            if ! gh api "repos/$repo/actions/workflows/nightly.yml/runs?branch=master&status=completed&per_page=1" > nightly.json; then
              echo "::error::$repo: cannot read the runs of nightly.yml"; status=1; continue
            fi
            python3 -I - "$repo" nightly.json <<'PY' || status=1
          import datetime, json, sys
          repo, path = sys.argv[1], sys.argv[2]
          runs = json.load(open(path)).get("workflow_runs") or []
          if not runs:
              sys.exit(f"::error::{repo}: no completed nightly.yml run on master")
          run = runs[0]
          started = datetime.datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
          age = datetime.datetime.now(datetime.timezone.utc) - started
          print(f"{repo}: nightly {run['html_url']} {run['conclusion']}, started {run['created_at']} ({age} ago)")
          if run["conclusion"] != "success":
              sys.exit(f"::error::{repo}: the latest nightly did not pass ({run['conclusion']}): {run['html_url']}")
          if age >= datetime.timedelta(hours=36):
              sys.exit(f"::error::{repo}: the latest nightly is older than 36 hours: {run['html_url']}")
          PY
          done
          exit "$status"

  candidate:
    needs: nightly-gate
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::not a version: $VERSION"; exit 1; }
          shell=$(sed -n 's/^version = "\(.*\)"$/\1/p' app/Cargo.toml | head -n 1)
          [ "v$shell" = "$VERSION" ] || { echo "::error::app/Cargo.toml says $shell, not ${VERSION#v}"; exit 1; }
      - run: python3 -I scripts/test_scan_secrets.py
      - run: python3 -I scripts/test_release_manifest.py
      - name: System libraries of the Tauri shell (WebKitGTK 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev libxdo-dev
      - working-directory: app
        run: |
          cargo test --locked
          cargo build --locked --release
      - run: python3 -m pip install --user uv==0.13.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the backend from the pinned studio commit
        run: |
          scripts/build_backend.sh "$RUNNER_TEMP/backend"
      - name: Package
        run: |
          mkdir -p release
          scripts/package_linux.sh app/target/release/nodestro-desktop "$RUNNER_TEMP/backend" \
            "release/nodestro-desktop-${VERSION}-linux-x86_64.tar.gz" "$VERSION"
      - run: scripts/smoke_test.sh "release/nodestro-desktop-${VERSION}-linux-x86_64.tar.gz"
      - name: Release manifest and checksums
        run: |
          python3 scripts/release_manifest.py --product nodestro-desktop --version "$VERSION" \
            --out release --studio-meta "$RUNNER_TEMP/backend/meta" \
            --python "$RUNNER_TEMP/backend/python/bin/python3" --cargo-manifest app/Cargo.toml \
            --bundled ollama="$RUNNER_TEMP/backend/ollama/OLLAMA-RELEASE" \
            --platform linux-x86_64 "release/nodestro-desktop-${VERSION}-linux-x86_64.tar.gz"
          python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print(m["version"], m["channel"], "unknown licenses:", m["licenses"]["unknown"])' release/release-manifest.json
      - name: Scan the release files for secrets
        run: python3 -I scripts/scan_secrets.py release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: release/
          retention-days: 30

  # The candidate archive (checked against its SHA256SUMS) on real Ubuntu 24.04 and Debian 13 machines.
  systems:
    needs: [nightly-gate, candidate]
    uses: ./.github/workflows/systems.yml
    with:
      artifact: release-candidate
      archive: nodestro-desktop-*-linux-x86_64.tar.gz
