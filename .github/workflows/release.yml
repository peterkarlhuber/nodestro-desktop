name: Release

# A tag `v*` builds the Linux x86_64 archive exactly as CI does. It then runs the clean-machine smoke test, writes
# the release manifest (component pins, checksums, license inventory, signing state) and creates a **draft**
# GitHub release. A person reviews the draft and publishes it. A manual run builds the same files without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: System libraries of the Tauri shell (WebKitGTK 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev libxdo-dev
      - working-directory: app
        run: cargo build --locked --release
      - name: Grant read access to the private repositories
        env:
          NODESTRO_READ: ${{ secrets.NODESTRO_READ }}
        run: |
          if [ -z "$NODESTRO_READ" ]; then
            echo "::error::Secret NODESTRO_READ is missing: a token with read access to orkexa and the nodestro repositories."
            exit 1
          fi
          git config --global url."https://x-access-token:${NODESTRO_READ}@github.com/peterkarlhuber/".insteadOf "https://github.com/peterkarlhuber/"
      - run: python3 -m pip install --user uv
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: scripts/build_backend.sh "$RUNNER_TEMP/backend"
      - run: scripts/package_linux.sh app/target/release/nodestro-desktop "$RUNNER_TEMP/backend" nodestro-linux-x86_64.tar.gz
      - run: scripts/smoke_test.sh nodestro-linux-x86_64.tar.gz
      - name: Release manifest and checksums
        run: |
          version="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="manual-${GITHUB_SHA::12}"
          python3 scripts/release_manifest.py --product nodestro-desktop --version "$version" \
            --out release --studio-meta "$RUNNER_TEMP/backend/meta" \
            --python "$RUNNER_TEMP/backend/python/bin/python3" --cargo-manifest app/Cargo.toml \
            --platform linux-x86_64 nodestro-linux-x86_64.tar.gz
          cp nodestro-linux-x86_64.tar.gz release/
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/
          retention-days: 30

  draft:
    # Only a tag creates a release, and only as a draft: publishing stays a person's decision.
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "Nodestro Desktop $GITHUB_REF_NAME (Linux x86_64, unsigned)" \
            --notes "Linux x86_64 only. Not signed: verify the archive against SHA256SUMS. Component pins, license inventory and signing state are in release-manifest.json. macOS and Windows are not built or tested."
